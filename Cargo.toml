[package]
name = "dkr"
version = "0.1.0"
edition = "2024"
authors = ["Petamori <petamorikei@gmail.com>"]
description = "A terminal user interface (TUI) for managing Docker containers, images, volumes, and networks"
license = "MIT"
repository = "https://github.com/petamorikei/dkr"
homepage = "https://github.com/petamorikei/dkr"
readme = "README.md"
keywords = ["docker", "tui", "terminal", "container", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# TUI framework
ratatui = "0.26"
crossterm = "0.27"

# Docker API client
bollard = "0.16"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Utilities
dirs = "5.0"
